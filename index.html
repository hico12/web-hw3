<!DOCTYPE html>
<html lang="ko">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>내 영화 보드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
 <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
    <h1>내 영화 보드</h1>
    <nav>
      <ul>
        <li><a href="#board">보드</a></li>
        <li><a href="#about">소개</a></li>
        <li><a href="#">상세</a></li>
      </ul>
    </nav>
</header>
<section class="hero">
    <h2>요즘 내가 고른 영화 다섯편</h2>
    <p>포스터 위에 마우스를 올려보세요</p>
</section>
  <main>
    <section class="controls">
      <input id="q" type="search" placeholder="제목 또는 줄거리 검색">

      <select id="sort">
        <option value="default">기본순</option>
        <option value="rating">평점순</option>
        <option value="year">최신순</option>
        <option value="title">제목순</option>
        <option value="audience">관객순</option>
      </select>

      <fieldset id="typeFilter">
        <label><input type="radio" name="type" value="all" checked> 전체</label>
        <label><input type="radio" name="type" value="mine"> 내 영화</label>
        <label><input type="radio" name="type" value="boxoffice"> 박스오피스</label>
      </fieldset>

      <span>찜: <strong id="likeCount">0</strong></span>
    </section>

    <div class="board" id="board"></div>
    <p class="state-empty">조건에 맞는 영화가 없습니다.</p>

    <dialog id="detail">
      <div class="detail-body"></div>
      <button id="closeDetail" type="button">닫기</button>
    </dialog>
  </main>

 <section id="about">  
</section>
 <footer>
 <p>이 사이트는 TMDB API를 사용하지만 TMDB의 보증이나 인증을 받지 않았습니다.
 This product uses the TMDB API but is not endorsed or certified by TMDB.</p>
 <p>포스터와 영화 정보: TMDB (https://www.themoviedb.org/movie/567646?language=ko-KR)</p>
 </footer>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
